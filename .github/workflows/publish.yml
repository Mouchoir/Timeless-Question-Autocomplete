name: Publish

# A pushed tag v<version> releases: the zip is built from the tag, a GitHub
# release is created with the zip attached (Wago Addons imports it through
# the release automation of the connected repository), then the zip goes to
# CurseForge. A manual run packages an existing tag again.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and upload again
        required: true
        type: string
      release_type:
        description: CurseForge release type
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write # the release is created here, with the zip attached

env:
  ADDON_NAME: TimelessQuestion
  ADDON_SOURCE: addon/TimelessQuestion
  CURSEFORGE_BASE_URL: https://wow.curseforge.com
  CURSEFORGE_PROJECT_ID: "1645570"
  # Each TOC listed here maps its Interface number to a game version on
  # CurseForge and on Wago.
  PUBLISH_TOCS: TimelessQuestion_Mists.toc
  # The Wago Addons project; the upload needs the WAGO_API_TOKEN secret too.
  WAGO_PROJECT_ID: x61x5pN1

jobs:
  publish:
    name: Release and upload
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the tag and the release type
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            # A 0.x version or a -beta suffix is a beta, -alpha an alpha, the rest a release.
            if [[ "$tag" == *-alpha* ]]; then
              release_type="alpha"
            elif [[ "$tag" =~ ^v0\. || "$tag" == *-beta* ]]; then
              release_type="beta"
            else
              release_type="release"
            fi
          else
            tag="$INPUT_TAG"
            release_type="$INPUT_RELEASE_TYPE"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Build addon zip
        id: build
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          rm -rf dist
          mkdir -p "dist/${ADDON_NAME}"
          # Only the addon folder goes in, so the zip has a single top-level
          # <name>/ directory as WoW expects.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='*.zip' \
            --exclude='dist/' \
            "${ADDON_SOURCE}/" "dist/${ADDON_NAME}/"
          (cd dist && zip -r "${ADDON_NAME}-${TAG}.zip" "${ADDON_NAME}")

          # The release assets Wago Addons imports. One flavour: the zip as is.
          # Several flavours (one TOC each): a copy of the zip per flavour,
          # named as Wago's "Multiple" game versions expect (-classic.zip,
          # -mists.zip, -forever.zip, ... and no suffix for Retail).
          suffixes=()
          for toc_name in ${PUBLISH_TOCS}; do
            iface="$(grep -iE '^## Interface:' "${ADDON_SOURCE}/${toc_name}" | grep -oE '[0-9]+' | head -1)"
            if (( 10#$iface >= 100000 )); then suffix=""
            elif (( 10#$iface >= 50000 )); then suffix="-mists"
            elif (( 10#$iface >= 40000 )); then suffix="-cata"
            elif (( 10#$iface >= 30000 )); then suffix="-wrath"
            elif (( 10#$iface >= 20000 )); then suffix="-bcc"
            elif (( 10#$iface >= 16000 )); then suffix="-forever"
            else suffix="-classic"; fi
            suffixes+=("$suffix")
          done
          assets=()
          if (( ${#suffixes[@]} <= 1 )); then
            assets+=("dist/${ADDON_NAME}-${TAG}.zip")
          else
            for suffix in "${suffixes[@]}"; do
              cp "dist/${ADDON_NAME}-${TAG}.zip" "dist/${ADDON_NAME}-${TAG}${suffix}.zip"
              assets+=("dist/${ADDON_NAME}-${TAG}${suffix}.zip")
            done
          fi
          echo "assets=${assets[*]}" >> "$GITHUB_OUTPUT"
          echo "release assets: ${assets[*]}"

      - name: Create the GitHub release with the zip
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TYPE: ${{ steps.release.outputs.release_type }}
          ASSETS: ${{ steps.build.outputs.assets }}
        run: |
          read -r -a assets <<<"$ASSETS"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            flags=()
            if [[ "$RELEASE_TYPE" != "release" ]]; then flags+=(--prerelease); fi
            # The zip is attached from the start, so Wago Addons sees it with
            # the release event. The notes list the commits since the last tag.
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes "${flags[@]}"
          fi
          # The release notes are the CurseForge changelog.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > "$RUNNER_TEMP/CHANGELOG.md"
          if [[ ! -s "$RUNNER_TEMP/CHANGELOG.md" ]]; then printf 'Release %s\n' "$TAG" > "$RUNNER_TEMP/CHANGELOG.md"; fi

      - name: Prepare CurseForge metadata
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          if [[ -z "$CURSEFORGE_PROJECT_ID" ]]; then
            echo "CURSEFORGE_PROJECT_ID is not set in the workflow: create the CurseForge project first." >&2
            exit 1
          fi
          if [[ -z "$CURSEFORGE_API_TOKEN" ]]; then
            echo "Missing CURSEFORGE_API_TOKEN repository secret." >&2
            exit 1
          fi

          versions_json="$(curl -sf \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            "${CURSEFORGE_BASE_URL}/api/game/versions")"

          # Resolve a CurseForge game-version id per published TOC. The version
          # comes from the TOC Interface number (16001 -> 1.60.1). Pinning to
          # explicit ids avoids the spurious duplicates CurseForge otherwise
          # infers from the TOC alone.
          ids=()
          for toc_name in ${PUBLISH_TOCS}; do
            toc="${ADDON_SOURCE}/${toc_name}"
            if [[ ! -f "$toc" ]]; then
              echo "TOC listed in PUBLISH_TOCS not found: $toc" >&2
              exit 1
            fi
            iface="$(grep -iE '^## Interface:' "$toc" | grep -oE '[0-9]+' | head -1)"
            if [[ -z "$iface" ]]; then
              echo "Could not read '## Interface:' from $toc" >&2
              exit 1
            fi
            version_string="$((10#$iface / 10000)).$((10#$iface / 100 % 100)).$((10#$iface % 100))"
            id="$(jq --arg v "$version_string" \
              'map(select(.name == $v)) | .[0].id // empty' <<<"$versions_json")"
            if [[ -z "$id" ]]; then
              echo "No CurseForge game version matches '$version_string' (from $toc_name). Available:" >&2
              jq -r '.[].name' <<<"$versions_json" | sort -uV >&2
              exit 1
            fi
            echo "$toc_name: interface $iface -> $version_string -> id $id"
            ids+=("$id")
          done

          game_versions="$(printf '%s\n' "${ids[@]}" | sort -un | jq -s '.')"

          jq -n \
            --rawfile changelog "$RUNNER_TEMP/CHANGELOG.md" \
            --arg displayName "${{ steps.release.outputs.tag }}" \
            --arg releaseType "${{ steps.release.outputs.release_type }}" \
            --argjson gameVersions "$game_versions" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersions: $gameVersions,
              releaseType: $releaseType
            }' > metadata.json

          echo "metadata.json:"; jq '.gameVersions, .displayName' metadata.json

      - name: Upload to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          curl --fail-with-body \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form "metadata=<metadata.json;type=application/json" \
            --form "file=@dist/${ADDON_NAME}-${{ steps.release.outputs.tag }}.zip" \
            "${CURSEFORGE_BASE_URL}/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file"

      - name: Upload to Wago Addons
        shell: bash
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TYPE: ${{ steps.release.outputs.release_type }}
        run: |
          if [[ -z "$WAGO_PROJECT_ID" || -z "$WAGO_API_TOKEN" ]]; then
            echo "Wago upload skipped: WAGO_PROJECT_ID (workflow) or the WAGO_API_TOKEN secret is missing."
            exit 0
          fi
          # One patch per published TOC, under the flavour key Wago expects
          # (addons.wago.io/api/data/game lists the valid patches).
          args=()
          for toc_name in ${PUBLISH_TOCS}; do
            iface="$(grep -iE '^## Interface:' "${ADDON_SOURCE}/${toc_name}" | grep -oE '[0-9]+' | head -1)"
            version_string="$((10#$iface / 10000)).$((10#$iface / 100 % 100)).$((10#$iface % 100))"
            if (( 10#$iface >= 100000 )); then flavour=retail
            elif (( 10#$iface >= 50000 )); then flavour=mop
            elif (( 10#$iface >= 40000 )); then flavour=cata
            elif (( 10#$iface >= 30000 )); then flavour=wotlk
            elif (( 10#$iface >= 20000 )); then flavour=bc
            elif (( 10#$iface >= 16000 )); then flavour=forever
            else flavour=classic; fi
            args+=(--arg "$flavour" "$version_string")
          done
          case "$RELEASE_TYPE" in
            release) stability=stable ;;
            *) stability="$RELEASE_TYPE" ;;
          esac
          jq -n \
            --rawfile changelog "$RUNNER_TEMP/CHANGELOG.md" \
            --arg label "$TAG" \
            --arg stability "$stability" \
            "${args[@]}" \
            '{ label: $label, stability: $stability, changelog: $changelog }
             + ($ARGS.named | del(.changelog, .label, .stability) | with_entries(.key |= "supported_\(.)_patches" | .value |= [.]))' > wago.json
          echo "wago.json:"; jq 'del(.changelog)' wago.json
          curl --fail-with-body \
            --header "Authorization: Bearer ${WAGO_API_TOKEN}" \
            --header "Accept: application/json" \
            --form "metadata=<wago.json;type=application/json" \
            --form "file=@dist/${ADDON_NAME}-${TAG}.zip" \
            "https://addons.wago.io/api/projects/${WAGO_PROJECT_ID}/version"
